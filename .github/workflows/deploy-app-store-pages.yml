name: Deploy App Store Pages

on:
  push:
    branches:
      - main
    paths:
      - 'app-store/**'
      - '.github/workflows/deploy-app-store-pages.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: app-store-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload static app-store site
        uses: actions/upload-pages-artifact@v4
        with:
          path: app-store

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
