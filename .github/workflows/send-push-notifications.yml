name: Send push notifications

on:
  schedule:
    # Запускати кожні 30 хвилин
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        type: choice
        default: push-worker
        options:
          - push-worker
          - broadcast-test

jobs:
  send_push:
    name: Send push notifications
    runs-on: ubuntu-latest

    steps:
      - name: Call push-worker Edge Function
        shell: bash
        run: |
          set -e
          MODE="${{ github.event.inputs.mode || 'push-worker' }}"
          if [ "$MODE" = "broadcast-test" ]; then
            ENDPOINT="send-broadcast"
            BODY='{"title":"Arcana","body":"Ваша карта дня вже готова. Натисніть, щоб відкрити.","platform":"ios","route":"daily","path":"/daily","limit":50}'
          else
            ENDPOINT="push-worker"
            BODY='{}'
          fi

          echo "Triggering $ENDPOINT (mode=$MODE)..."

          HTTP_CODE=$(curl --retry 3 --retry-delay 2 --retry-all-errors \
            -sS -L -X POST "https://rgqfkdhzllhmagrcasav.functions.supabase.co/$ENDPOINT" \
            -H "x-push-secret: ${{ secrets.ADMIN_PUSH_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            -o response.json \
            -w "%{http_code}")

          echo "HTTP $HTTP_CODE"
          echo "Response:"
          cat response.json || true
          echo ""

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Error: push-worker returned $HTTP_CODE"
            exit 1
          fi

          echo "Push notifications sent successfully"
