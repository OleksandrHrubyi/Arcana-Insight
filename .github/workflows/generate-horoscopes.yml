name: Generate horoscopes daily

on:
  schedule:
    - cron: "0 0 * * *" # щодня 00:00 UTC
  workflow_dispatch: {}

jobs:
  astro_context:
    name: Build astro context (+1/+2)
    runs-on: ubuntu-latest

    steps:
      - name: Build astro context via edge function (days=2)
        shell: bash
        run: |
          set -e
          DATE=$(date -u -d "+1 day" +%F)
          echo "Building astro context from date=$DATE for 2 days..."

          HTTP_CODE=$(curl --retry 5 --retry-delay 3 --retry-all-errors \
            --connect-timeout 20 \
            --max-time 240 \
            -sS -L -X POST \
            "${{ secrets.SUPABASE_URL }}/functions/v1/build-astro-context" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"date\":\"$DATE\",\"days\":2}" \
            -o response.json \
            -w "%{http_code}")

          echo "HTTP $HTTP_CODE"
          echo "Response:"
          cat response.json || true
          echo ""

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            exit 1
          fi

  generate_horoscopes:
    name: Generate horoscopes (+1/+2)
    runs-on: ubuntu-latest
    needs: astro_context

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        offset: [1, 2]
        theme: [love, career, energy]

    steps:
      - name: Call Supabase Edge Function (generate-horoscopes)
        shell: bash
        run: |
          set -e
          DATE=$(date -u -d "+${{ matrix.offset }} day" +%F)
          THEME="${{ matrix.theme }}"
          echo "Generate for date=$DATE theme=$THEME (will generate en+uk)"

          HTTP_CODE=$(curl --retry 5 --retry-delay 3 --retry-all-errors \
            --connect-timeout 20 \
            --max-time 240 \
            -sS -L -X POST "${{ secrets.SUPABASE_FUNCTION_URL }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "{\"date\":\"$DATE\",\"theme\":\"$THEME\"}" \
            -o response.json \
            -w "%{http_code}")

          echo "HTTP $HTTP_CODE"
          echo "Response:"
          cat response.json || true
          echo ""

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            exit 1
          fi
