<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<title>Arcana Insight — Bottom Nav v3</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Manrope', -apple-system, sans-serif;
    background: linear-gradient(180deg, #101721 0%, #12202b 16.7%, #142632 35.58%, #12212b 57.35%, #080c0f 96.63%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    overflow: hidden;
  }

  .page {
    flex: 1;
    background: radial-gradient(120% 60% at 50% 0%, #0a2233 0%, #07131d 40%, #050d15 100%);
  }

  /* ═══════════════════════════════════════════
     BOTTOM NAV v3 — Arcana Insight theme
     Filled icons + bright pill + Telegram anim
     ═══════════════════════════════════════════ */

  .nav-outer {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 100;
    pointer-events: none;
  }

  .nav-outer::before {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 130px;
    background: linear-gradient(180deg,
      rgba(5, 13, 21, 0) 0%,
      rgba(5, 13, 21, 0.65) 35%,
      rgba(5, 13, 21, 0.95) 68%,
      rgba(5, 13, 21, 1) 100%
    );
    pointer-events: none;
    z-index: -1;
  }

  .nav-pill {
    pointer-events: auto;
    display: flex;
    align-items: center;

    max-width: 380px;
    margin: 0 auto 12px;
    padding: 4px 4px calc(env(safe-area-inset-bottom, 0px) + 4px);
    border-radius: 28px;
    position: relative;
    isolation: isolate;
    overflow: hidden;

    background:
      radial-gradient(140% 160% at 50% -30%, rgba(159, 216, 246, 0.08) 0%, transparent 50%),
      linear-gradient(160deg, rgba(16, 24, 38, 0.96) 0%, rgba(8, 13, 22, 0.98) 100%);
    border: 1px solid rgba(159, 216, 246, 0.13);
    box-shadow:
      0 12px 44px rgba(0, 0, 0, 0.55),
      0 2px 8px rgba(0, 0, 0, 0.3),
      inset 0 1px 0 rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(18px) saturate(120%);
    -webkit-backdrop-filter: blur(18px) saturate(120%);
  }

  /* Верхній акцентний блік */
  .nav-pill::after {
    content: '';
    position: absolute;
    top: 0; left: 15%; right: 15%;
    height: 1px;
    background: linear-gradient(90deg,
      transparent,
      rgba(159, 216, 246, 0.2) 30%,
      rgba(159, 216, 246, 0.35) 50%,
      rgba(159, 216, 246, 0.2) 70%,
      transparent
    );
    pointer-events: none;
    z-index: 10;
  }

  /* ─── Таб ─── */
  .nav-tab {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;

    flex: 1;
    min-height: 56px;
    padding: 6px 2px 5px;

    background: none;
    border: 0;
    outline: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    user-select: none;
    z-index: 1;

    color: rgba(159, 216, 246, 0.32);
    transition: color 220ms ease;
  }

  .nav-tab:active {
    transform: scale(0.9);
    transition: transform 60ms ease;
  }

  .nav-tab.active {
    color: #ffffff;
  }

  /* ─── Pill-підсвітка (Telegram-style) ─── */
  .nav-tab__pill {
    position: absolute;
    top: 4px; bottom: 4px;
    left: 6px; right: 6px;
    border-radius: 20px;
    z-index: -1;
    pointer-events: none;

    opacity: 0;
    transform: scaleX(0.35) scaleY(0.7);

    background:
      radial-gradient(ellipse 90% 100% at 50% 0%, rgba(159, 216, 246, 0.18) 0%, transparent 60%),
      rgba(159, 216, 246, 0.07);
    border: 0.5px solid rgba(159, 216, 246, 0.14);
    box-shadow:
      0 0 20px rgba(159, 216, 246, 0.08),
      inset 0 1px 0 rgba(255, 255, 255, 0.04);

    transition:
      opacity 200ms cubic-bezier(0.4, 0, 0.2, 1),
      transform 350ms cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .nav-tab.active .nav-tab__pill {
    opacity: 1;
    transform: scaleX(1) scaleY(1);
  }

  /* ─── Іконка ─── */
  .nav-tab__icon {
    position: relative;
    z-index: 1;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;

    transition:
      transform 350ms cubic-bezier(0.175, 0.885, 0.32, 1.275),
      filter 260ms ease;
  }

  .nav-tab__icon svg {
    width: 28px;
    height: 28px;
    display: block;
    transition: opacity 200ms ease;
  }

  /* Inactive icon hidden, active icon shown */
  .nav-tab__icon .icon-active { display: none; }
  .nav-tab__icon .icon-inactive { display: block; }

  .nav-tab.active .nav-tab__icon .icon-active { display: block; }
  .nav-tab.active .nav-tab__icon .icon-inactive { display: none; }

  .nav-tab.active .nav-tab__icon {
    transform: scale(1.12) translateY(-1px);
    filter: drop-shadow(0 0 10px rgba(159, 216, 246, 0.4));
  }

  /* ─── Лейбл ─── */
  .nav-tab__label {
    position: relative;
    z-index: 1;
    font-size: 10px;
    line-height: 1;
    font-weight: 500;
    letter-spacing: 0.02em;
    white-space: nowrap;
    transition:
      color 220ms ease,
      transform 350ms cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .nav-tab.active .nav-tab__label {
    font-weight: 700;
    transform: translateY(0px);
  }

  /* ─── Dot indicator ─── */
  .nav-tab__dot {
    position: absolute;
    bottom: 2px;
    left: 50%;
    width: 4px;
    height: 4px;
    margin-left: -2px;
    border-radius: 50%;
    background: rgba(159, 216, 246, 0.8);
    box-shadow: 0 0 6px rgba(159, 216, 246, 0.5);
    opacity: 0;
    transform: scale(0);
    transition:
      opacity 250ms ease,
      transform 350ms cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .nav-tab.active .nav-tab__dot {
    opacity: 1;
    transform: scale(1);
  }
</style>
</head>
<body>

<div class="page"></div>

<div class="nav-outer">
  <div class="nav-pill">

    <!-- Аркана -->
    <button class="nav-tab active" onclick="activate(this)">
      <span class="nav-tab__pill"></span>
      <span class="nav-tab__icon">
        <!-- Inactive: outline -->
        <svg class="icon-inactive" viewBox="0 0 28 28" fill="none">
          <circle cx="14" cy="13.5" r="10" stroke="currentColor" stroke-width="1.7"/>
          <path d="M5 14.5c6-7 13-7.5 18.5 0" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <!-- Active: filled -->
        <svg class="icon-active" viewBox="0 0 28 28" fill="none">
          <circle cx="14" cy="13.5" r="10.5" fill="currentColor" opacity="0.15"/>
          <circle cx="14" cy="13.5" r="10" stroke="currentColor" stroke-width="1.8"/>
          <path d="M5 14.5c6-7 13-7.5 18.5 0" fill="currentColor" opacity="0.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="14" cy="11" r="2" fill="currentColor" opacity="0.5"/>
        </svg>
      </span>
      <span class="nav-tab__label">Аркана</span>
      <span class="nav-tab__dot"></span>
    </button>

    <!-- Гороскоп -->
    <button class="nav-tab" onclick="activate(this)">
      <span class="nav-tab__pill"></span>
      <span class="nav-tab__icon">
        <!-- Inactive -->
        <svg class="icon-inactive" viewBox="0 0 28 28" fill="none">
          <path d="M23 17A9 9 0 1 1 13.5 5a7.2 7.2 0 0 0 9.5 12z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="20.5" cy="6.5" r="0.9" fill="currentColor" opacity="0.6"/>
          <circle cx="23" cy="10" r="0.65" fill="currentColor" opacity="0.5"/>
        </svg>
        <!-- Active -->
        <svg class="icon-active" viewBox="0 0 28 28" fill="none">
          <path d="M23 17A9 9 0 1 1 13.5 5a7.2 7.2 0 0 0 9.5 12z" fill="currentColor" opacity="0.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="20.5" cy="6.5" r="1.2" fill="currentColor" opacity="0.7"/>
          <circle cx="23" cy="10" r="0.9" fill="currentColor" opacity="0.6"/>
          <circle cx="18" cy="4.5" r="0.7" fill="currentColor" opacity="0.5"/>
        </svg>
      </span>
      <span class="nav-tab__label">Гороскоп</span>
      <span class="nav-tab__dot"></span>
    </button>

    <!-- Таро -->
    <button class="nav-tab" onclick="activate(this)">
      <span class="nav-tab__pill"></span>
      <span class="nav-tab__icon">
        <!-- Inactive -->
        <svg class="icon-inactive" viewBox="0 0 28 28" fill="none">
          <rect x="5" y="3.5" width="12.5" height="18" rx="2.5" stroke="currentColor" stroke-width="1.7"/>
          <rect x="10.5" y="6.5" width="12.5" height="18" rx="2.5" stroke="currentColor" stroke-width="1.7"/>
        </svg>
        <!-- Active -->
        <svg class="icon-active" viewBox="0 0 28 28" fill="none">
          <rect x="5" y="3.5" width="12.5" height="18" rx="2.5" fill="currentColor" opacity="0.18" stroke="currentColor" stroke-width="1.8"/>
          <rect x="10.5" y="6.5" width="12.5" height="18" rx="2.5" fill="currentColor" opacity="0.12" stroke="currentColor" stroke-width="1.8"/>
          <path d="M15 12.5l2.5 5-2.5 1.2-2.5-1.2 2.5-5z" fill="currentColor" opacity="0.5"/>
        </svg>
      </span>
      <span class="nav-tab__label">Таро</span>
      <span class="nav-tab__dot"></span>
    </button>

    <!-- Меню -->
    <button class="nav-tab" onclick="activate(this)">
      <span class="nav-tab__pill"></span>
      <span class="nav-tab__icon">
        <!-- Inactive -->
        <svg class="icon-inactive" viewBox="0 0 28 28" fill="none">
          <line x1="6" y1="8.5" x2="22" y2="8.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          <line x1="6" y1="14" x2="22" y2="14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          <line x1="6" y1="19.5" x2="22" y2="19.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <!-- Active -->
        <svg class="icon-active" viewBox="0 0 28 28" fill="none">
          <line x1="6" y1="8.5" x2="22" y2="8.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          <line x1="6" y1="14" x2="18" y2="14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          <line x1="6" y1="19.5" x2="22" y2="19.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          <circle cx="21" cy="14" r="1.5" fill="currentColor" opacity="0.5"/>
        </svg>
      </span>
      <span class="nav-tab__label">Меню</span>
      <span class="nav-tab__dot"></span>
    </button>

  </div>
</div>

<script>
function activate(el) {
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
}
</script>
</body>
</html>
